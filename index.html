<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดบัญชี — เนส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E8;
    --surface:#FFFFFF;
    --ink:#23281F;
    --ink-soft:#5B6055;
    --line:#DEDACD;
    --jade:#2C5F4A;
    --jade-soft:#E4EEE8;
    --gold:#B8863C;
    --gold-soft:#F5E9D3;
    --rust:#A63D40;
    --rust-soft:#F5E1E0;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:20px 16px 86px;}
  h1,h2,h3{font-family:'Noto Serif Thai',serif;margin:0;}
  .header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:14px;margin-bottom:18px;border-bottom:2px solid var(--ink);
  }
  .header h1{font-size:22px;font-weight:600;}
  .header .sub{font-size:12px;color:var(--ink-soft);}

  /* Bottom tab nav */
  .tabs{
    display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 10px calc(6px + env(safe-area-inset-bottom));
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    max-width:720px;margin:0 auto;
  }
  .tab{
    flex:1;text-align:center;padding:8px 4px 6px;font-size:11px;font-weight:500;
    border-radius:4px;cursor:pointer;color:var(--ink-soft);user-select:none;
    transition:background .15s, color .15s;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .tab .icon{font-size:18px;line-height:1;}
  .tab.active{background:var(--jade-soft);color:var(--jade);}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }
  .card + .card{margin-top:14px;}
  .section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--ink-soft);font-size:12.5px;}

  /* Dashboard stat row */
  .stat-row{display:flex;gap:12px;margin-bottom:14px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .stat .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .stat .value{font-size:20px;font-weight:600;font-family:'Noto Serif Thai',serif;}
  .stat.income .value{color:var(--jade);}
  .stat.expense .value{color:var(--rust);}

  /* Receipt-style transaction list */
  .receipt-list{}
  .receipt-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 2px;border-bottom:1px dashed var(--line);
  }
  .receipt-row:last-child{border-bottom:none;}
  .receipt-row .left{display:flex;flex-direction:column;gap:2px;}
  .receipt-row .merchant{font-size:14px;font-weight:500;}
  .receipt-row .meta{font-size:11.5px;color:var(--ink-soft);}
  .receipt-row .amount{font-size:14.5px;font-weight:600;font-family:'Noto Serif Thai',serif;}
  .amount.expense{color:var(--rust);}
  .amount.income{color:var(--jade);}
  .tag{
    display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;
    background:var(--jade-soft);color:var(--jade);margin-left:6px;
  }

  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}

  .cat-icon{
    width:36px;height:36px;min-width:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .pie{width:170px;height:170px;border-radius:50%;margin:6px auto 18px;}
  .pie-legend{display:flex;flex-direction:column;gap:9px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .legend-row .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .legend-cat{flex:1;}
  .legend-pct{color:var(--ink-soft);width:44px;text-align:right;}
  .legend-amt{width:88px;text-align:right;font-weight:600;font-family:'Noto Serif Thai',serif;}

  /* Quick add screen */
  .amount-big{
    width:100%;border:none;border-bottom:2px solid var(--line);background:transparent;
    text-align:center;font-family:'Noto Serif Thai',serif;font-weight:600;font-size:38px;
    padding:10px 0 14px;color:var(--ink);
  }
  .amount-big:focus{outline:none;border-bottom-color:var(--jade);}
  .amount-big::placeholder{color:var(--line);}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;}
  .cat-chip{
    display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;
    border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:11px;
    background:#fff;color:var(--ink-soft);user-select:none;
  }
  .cat-chip .ic{font-size:19px;}
  .cat-chip.selected{border-color:var(--jade);background:var(--jade-soft);color:var(--jade);font-weight:600;}

  /* Add entry method switch */
  .method-switch{display:flex;gap:6px;margin-bottom:16px;}
  .method-btn{
    flex:1;padding:10px 6px;text-align:center;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-soft);
  }
  .method-btn.active{border-color:var(--jade);background:var(--jade-soft);color:var(--jade);}

  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:4px;
    font-family:'IBM Plex Sans Thai',sans-serif;font-size:14px;background:#fff;color:var(--ink);
  }
  textarea{min-height:90px;resize:vertical;}
  input[type=file]{
    width:100%;padding:16px;border:1px dashed var(--line);border-radius:4px;background:var(--paper);
    font-size:13px;
  }
  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{
    flex:1;padding:9px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-size:13px;font-weight:500;
  }
  .type-toggle button.sel-expense{border-color:var(--rust);background:var(--rust-soft);color:var(--rust);}
  .type-toggle button.sel-income{border-color:var(--jade);background:var(--jade-soft);color:var(--jade);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;color:var(--ink);font-size:13.5px;}

  .btn{
    display:inline-block;padding:11px 18px;border-radius:4px;border:none;cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif;font-size:14px;font-weight:600;
  }
  .btn-primary{background:var(--jade);color:#fff;width:100%;margin-top:16px;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn-block{width:100%;}

  .parse-status{font-size:13px;color:var(--ink-soft);text-align:center;padding:14px 0;}
  .parse-status.error{color:var(--rust);}

  .confirm-box{border:1px solid var(--jade);background:var(--jade-soft);border-radius:var(--radius);padding:14px;margin-top:14px;}
  .confirm-box .hint{font-size:11.5px;color:var(--jade);margin-bottom:10px;}

  /* Bills page */
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-nav button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);padding:4px 10px;}
  .month-nav .current{font-family:'Noto Serif Thai',serif;font-size:17px;font-weight:600;}

  .bill-line{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px dashed var(--line);}
  .bill-line:last-child{border-bottom:none;}
  .bill-line .name{font-size:14px;}
  .bill-line .amt-input{width:110px;text-align:right;padding:6px 8px;}
  .paid-pill{
    font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;font-weight:500;border:1px solid var(--line);
    background:#fff;color:var(--ink-soft);white-space:nowrap;
  }
  .paid-pill.paid{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);}
  .paid-pill.due{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}

  .split-summary{display:flex;gap:12px;margin-top:14px;}
  .split-card{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px;text-align:center;}
  .split-card .who{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .split-card .amt{font-family:'Noto Serif Thai',serif;font-weight:600;font-size:16px;}

  .history-row{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px;}
  .history-row:last-child{border-bottom:none;}
  .history-row .m{color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;z-index:100;
  }
  .toast.show{opacity:1;bottom:30px;}

  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235B6055'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
  .people-chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;margin:3px 4px 3px 0;}
  .people-chip button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;}

  /* More menu */
  .menu-item{
    display:flex;align-items:center;gap:12px;padding:16px 14px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--surface);margin-bottom:10px;cursor:pointer;
  }
  .menu-item .ic{font-size:22px;}
  .menu-item .txt{flex:1;}
  .menu-item .txt .t1{font-weight:600;font-size:14.5px;}
  .menu-item .txt .t2{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .menu-item .arrow{color:var(--ink-soft);}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;color:var(--ink-soft);font-size:13.5px;}

  /* Toggle switch */
  .switch{position:relative;width:42px;height:24px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.15s;}
  .switch .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--jade);}
  .switch input:checked + .slider:before{transform:translateX(18px);}

  /* Recurring / debt rows */
  .rec-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px dashed var(--line);}
  .rec-row:last-child{border-bottom:none;}
  .rec-row .info{flex:1;}
  .rec-row .info .nm{font-size:14px;font-weight:500;}
  .rec-row .info .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .rec-row .amt{font-family:'Noto Serif Thai',serif;font-weight:600;font-size:14px;margin-right:4px;white-space:nowrap;}
  .icon-btn{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:4px 6px;}

  .debt-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--surface);}
  .debt-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .debt-card .person{font-weight:600;font-size:14.5px;}
  .debt-card .dates{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .debt-card .amt{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:17px;}
  .overdue-tag{background:var(--rust-soft);color:var(--rust);font-size:10.5px;padding:2px 8px;border-radius:10px;margin-left:6px;}
  .debt-actions{display:flex;gap:8px;margin-top:10px;}
  .debt-actions .btn-settle{flex:1;background:var(--jade);color:#fff;border:none;border-radius:4px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;}

  /* Quick add */
  .quick-add-row{display:flex;gap:8px;margin-bottom:14px;}
  .quick-add-row input{flex:1;}
  .quick-add-row button{background:var(--jade);color:#fff;border:none;border-radius:4px;padding:0 16px;font-size:18px;cursor:pointer;}

  /* Trend bars */
  .trend-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:0 4px;margin-bottom:14px;}
  .trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .trend-bars{display:flex;align-items:flex-end;gap:2px;height:110px;width:100%;justify-content:center;}
  .trend-bars .bar{width:9px;border-radius:2px 2px 0 0;}
  .trend-col .lbl{font-size:10px;color:var(--ink-soft);}
  .trend-legend{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .trend-legend span{display:inline-flex;align-items:center;gap:5px;}
  .trend-legend .dot{width:8px;height:8px;border-radius:50%;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>สมุดบัญชี</h1>
    <div class="sub" id="todayLabel"></div>
  </div>

  <div id="view"></div>
</div>

<div class="tabs">
  <div class="tab" data-tab="add"><span class="icon">✏️</span>เพิ่มรายการ</div>
  <div class="tab" data-tab="card"><span class="icon">💳</span>บัตร</div>
  <div class="tab" data-tab="bills"><span class="icon">🏠</span>ค่าน้ำค่าไฟ</div>
  <div class="tab active" data-tab="dashboard"><span class="icon">📋</span>ภาพรวม</div>
  <div class="tab" data-tab="more"><span class="icon">⋯</span>เพิ่มเติม</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const CATEGORIES = ["อาหาร","เดินทาง","ช้อปปิ้ง","บิล","ความบันเทิง","สุขภาพ","อื่นๆ"];
const CATEGORY_META = {
  "อาหาร":       {icon:"🍜", color:"#E07A5F"},
  "เดินทาง":     {icon:"🚗", color:"#3D5A80"},
  "ช้อปปิ้ง":    {icon:"🛍️", color:"#9B5DE5"},
  "บิล":         {icon:"🧾", color:"#F4A261"},
  "ความบันเทิง": {icon:"🎬", color:"#2A9D8F"},
  "สุขภาพ":      {icon:"💊", color:"#E63946"},
  "อื่นๆ":       {icon:"📌", color:"#8D99AE"},
  "รายรับ":      {icon:"💰", color:"#2C5F4A"}
};
function catMeta(c){ return CATEGORY_META[c] || CATEGORY_META["อื่นๆ"]; }
const CATEGORY_KEYWORDS = {
  "อาหาร": ["ร้านอาหาร","cafe","coffee","กาแฟ","food","restaurant","7-eleven","เซเว่น","starbucks","kfc","mcdonald","ตลาด"],
  "เดินทาง": ["grab","taxi","แท็กซี่","bts","mrt","น้ำมัน","ปตท","bangchak","เดินทาง"],
  "ช้อปปิ้ง": ["shopee","lazada","shop","ช้อป","store","mall"],
  "บิล": ["การไฟฟ้า","ประปา","true","ais","dtac","เน็ต","ค่าน้ำ","ค่าไฟ","internet"],
  "ความบันเทิง": ["netflix","spotify","cinema","หนัง","เกม","game"],
  "สุขภาพ": ["โรงพยาบาล","clinic","คลินิก","pharmacy","ยา"]
};
const BILL_FIELDS = [
  {key:"house", label:"ค่าบ้าน"},
  {key:"water", label:"ค่าน้ำ"},
  {key:"electric", label:"ค่าไฟ"},
  {key:"net", label:"ค่าเน็ต"},
  {key:"gas", label:"ค่าน้ำมัน"}
];

/* Seed history from Nes's spreadsheet (Share_House_Budget.xlsx), read-only reference, 3-way split historically */
const SEED_BILLS = [
  /* historical reference data removed for privacy before hosting this file at a public URL —
     if you want it back, re-enter your past months manually in the "ค่าน้ำค่าไฟ" tab; that data
     stays only in your own browser (localStorage), never in this shared file. */
].map(r=>({
  month:r[0],
  house:r[1],water:r[2],electric:r[3],net:r[4],gas:r[5],
  people:3, includesNes:false, historical:true,
  paid:{house:true,water:true,electric:true,net:true,gas:true}
}));

/* ============ STATE ============ */
let state = {
  transactions: [], // {id,date,amount,type,category,merchant,source,isCard,note}
  bills: {},        // month -> {house,water,electric,net,gas,people,includesNes,paid:{}}
  settings: { people: ["T","P"] },
  currentBillMonth: monthKey(new Date()),
  recurring: [],     // {id,name,category,amount(or null="ไม่แน่นอน"),day,enabled}
  debts: { owe: [], owed: [] } // each: {id,person,amount,lendDate,dueDate,settled}
};
let activeTab = "dashboard";
let dashMonth = monthKey(new Date());
let dashView = "list"; // "list" | "summary"
let summarySubView = "pie"; // "pie" | "trend"
let moreView = "menu"; // "menu" | "recurring" | "debts"
let debtTab = "owe"; // "owe" | "owed"

function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabelTH(key){
  const months=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const [y,m]=key.split("-"); return months[parseInt(m)-1]+" "+y;
}
function fmt(n){ return (n<0?"-":"")+Math.abs(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ============ STORAGE (localStorage — works in any standalone browser) ============ */
async function loadState(){
  try{
    const raw = localStorage.getItem('finance-tracker-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){ /* no data yet */ }
  // seed bills history only once, non-destructively
  let seeded=false;
  SEED_BILLS.forEach(b=>{
    if(!state.bills[b.month]){ state.bills[b.month]=b; seeded=true; }
  });
  if(seeded) await saveState();
}
async function saveState(){
  try{
    localStorage.setItem('finance-tracker-data', JSON.stringify(state));
  }catch(e){ showToast("บันทึกไม่สำเร็จ พื้นที่เก็บข้อมูลในเบราว์เซอร์อาจเต็ม"); }
}

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ CATEGORY GUESS ============ */
function guessCategory(text){
  if(!text) return "อื่นๆ";
  const low=text.toLowerCase();
  for(const [cat,words] of Object.entries(CATEGORY_KEYWORDS)){
    if(words.some(w=>low.includes(w.toLowerCase()))) return cat;
  }
  return "อื่นๆ";
}

function parseQuickAdd(text){
  text = (text||"").trim();
  if(!text) return null;
  let m = text.match(/^(.*?)\s*([\d,]+(?:\.\d+)?)\s*(?:บาท)?$/);
  let merchant, amount;
  if(m && m[2]!==undefined && m[2]!==""){
    merchant = m[1].trim();
    amount = parseFloat(m[2].replace(/,/g,""));
  }
  if(!amount){
    m = text.match(/^([\d,]+(?:\.\d+)?)\s*(?:บาท)?\s*(.*)$/);
    if(m && m[1]){
      amount = parseFloat(m[1].replace(/,/g,""));
      merchant = m[2].trim();
    }
  }
  if(!amount || isNaN(amount) || amount<=0) return null;
  return { amount, merchant: merchant || "รายการ" };
}

/* ============ RENDER: ROUTER ============ */
function render(){
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===activeTab));
  const view = document.getElementById('view');
  if(activeTab==="dashboard") view.innerHTML = renderDashboard();
  if(activeTab==="add") view.innerHTML = renderAdd();
  if(activeTab==="card") view.innerHTML = renderCard();
  if(activeTab==="bills") view.innerHTML = renderBills();
  if(activeTab==="more") view.innerHTML = renderMore();
  attachHandlers();
}

/* ============ DASHBOARD ============ */
function isoWeekStart(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = (d.getDay()+6)%7; // Mon=0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function shortDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.getDate()+"/"+(d.getMonth()+1);
}
function weekRangeLabel(weekStart){
  const s = new Date(weekStart+"T00:00:00");
  const e = new Date(s); e.setDate(e.getDate()+6);
  return shortDate(weekStart)+" – "+shortDate(e.toISOString().slice(0,10));
}

function renderDashboard(){
  const mk = dashMonth;
  const monthTx = state.transactions.filter(t=>t.date && t.date.slice(0,7)===mk);
  const income = monthTx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = monthTx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);

  const bill = state.bills[mk];
  let dueHtml = "";
  if(bill && !bill.historical){
    const unpaid = BILL_FIELDS.filter(f=>!bill.paid || !bill.paid[f.key]);
    if(unpaid.length){
      dueHtml = `<div class="card"><div class="section-title">บิลเดือนนี้ที่ยังไม่จ่าย</div>
        <div class="receipt-list">${unpaid.map(f=>`<div class="receipt-row"><div class="left"><span class="merchant">${f.label}</span></div><span class="paid-pill due">ยังไม่จ่าย</span></div>`).join("")}</div>
      </div>`;
    }
  }

  const headerBlock = `
    <div class="card" style="margin-bottom:12px;">
      <div class="month-nav" style="margin-bottom:10px;">
        <button id="dashPrevMonth">‹</button>
        <div class="current">${monthLabelTH(mk)}</div>
        <button id="dashNextMonth">›</button>
      </div>
      <div class="stat-row" style="margin-bottom:0;">
        <div class="stat income"><div class="label">รายรับ</div><div class="value">฿${fmt(income)}</div></div>
        <div class="stat expense"><div class="label">รายจ่าย</div><div class="value">฿${fmt(expense)}</div></div>
      </div>
      <button class="btn btn-secondary btn-block" id="toggleSummaryBtn" style="margin-top:12px;">
        ${dashView==="list" ? "📊 ดูสรุปตามหมวดหมู่" : "📋 ดูรายการ"}
      </button>
    </div>
  `;

  if(dashView==="summary"){
    return headerBlock + renderSummaryTabs() + (summarySubView==="trend" ? renderTrendChart() : renderCategorySummary(monthTx.filter(t=>t.type==="expense")));
  }

  return headerBlock + dueHtml + renderWeeklyList(monthTx);
}

function renderSummaryTabs(){
  return `
    <div class="type-toggle" style="margin-bottom:14px;">
      <button type="button" id="subViewPie" class="${summarySubView==='pie'?'sel-expense':''}">สัดส่วน</button>
      <button type="button" id="subViewTrend" class="${summarySubView==='trend'?'sel-income':''}">แนวโน้ม 6 เดือน</button>
    </div>
  `;
}

function renderTrendChart(){
  const months = [];
  let cursor = dashMonth;
  for(let i=0;i<6;i++){ months.unshift(cursor); cursor = shiftMonth(cursor,-1); }
  const data = months.map(mk=>{
    const tx = state.transactions.filter(t=>t.date && t.date.slice(0,7)===mk);
    return {
      mk,
      income: tx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0),
      expense: tx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0)
    };
  });
  const max = Math.max(1, ...data.flatMap(d=>[d.income,d.expense]));
  return `<div class="card">
    <div class="section-title">รายรับ vs รายจ่าย 6 เดือน</div>
    <div class="trend-legend">
      <span><span class="dot" style="background:var(--jade);"></span>รายรับ</span>
      <span><span class="dot" style="background:var(--rust);"></span>รายจ่าย</span>
    </div>
    <div class="trend-chart">
      ${data.map(d=>`
        <div class="trend-col">
          <div class="trend-bars">
            <div class="bar" style="height:${Math.round(d.income/max*100)}%;background:var(--jade);"></div>
            <div class="bar" style="height:${Math.round(d.expense/max*100)}%;background:var(--rust);"></div>
          </div>
          <span class="lbl">${monthLabelTH(d.mk).split(" ")[0]}</span>
        </div>
      `).join("")}
    </div>
  </div>`;
}

function renderWeeklyList(monthTx){
  const sorted = [...monthTx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  if(!sorted.length){
    return `<div class="card"><div class="empty">ยังไม่มีรายการเดือนนี้ — ลองเพิ่มรายการแรกที่แท็บ "เพิ่มรายการ"</div></div>`;
  }
  const groups = []; // {weekStart, items:[]}
  sorted.forEach(t=>{
    const ws = isoWeekStart(t.date);
    let g = groups[groups.length-1];
    if(!g || g.weekStart!==ws){ g={weekStart:ws, items:[]}; groups.push(g); }
    g.items.push(t);
  });
  return groups.map(g=>{
    const subtotal = g.items.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
    return `<div class="card">
      <div class="section-title"><span>สัปดาห์ ${weekRangeLabel(g.weekStart)}</span><span class="muted">รวม ฿${fmt(subtotal)}</span></div>
      <div class="receipt-list">${g.items.map(txRow).join("")}</div>
    </div>`;
  }).join("");
}

function renderCategorySummary(expenseTx){
  const totals = {};
  expenseTx.forEach(t=>{ totals[t.category] = (totals[t.category]||0) + t.amount; });
  const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const grand = entries.reduce((s,e)=>s+e[1],0);

  if(!entries.length){
    return `<div class="card"><div class="empty">ยังไม่มีรายจ่ายเดือนนี้ให้สรุป</div></div>`;
  }

  let acc=0;
  const stops = entries.map(([cat,amt])=>{
    const start=acc/grand*360; acc+=amt; const end=acc/grand*360;
    return `${catMeta(cat).color} ${start}deg ${end}deg`;
  }).join(", ");

  return `<div class="card">
    <div class="section-title">สัดส่วนรายจ่ายตามหมวดหมู่</div>
    <div class="pie" style="background:conic-gradient(${stops});"></div>
    <div class="pie-legend">
      ${entries.map(([cat,amt])=>{
        const pct = (amt/grand*100).toFixed(1);
        return `<div class="legend-row">
          <span class="dot" style="background:${catMeta(cat).color}"></span>
          <span class="legend-cat">${catMeta(cat).icon} ${cat}</span>
          <span class="legend-pct">${pct}%</span>
          <span class="legend-amt">฿${fmt(amt)}</span>
        </div>`;
      }).join("")}
    </div>
    <div class="bill-line" style="border-top:1px solid var(--ink);margin-top:10px;padding-top:12px;">
      <span class="name" style="font-weight:600;">รวมรายจ่ายทั้งหมด</span>
      <span style="font-weight:600;font-family:'Noto Serif Thai',serif;">฿${fmt(grand)}</span>
    </div>
  </div>`;
}

function txRow(t){
  const sign = t.type==="expense" ? "-" : "+";
  const meta = catMeta(t.category);
  return `<div class="receipt-row">
    <div class="left" style="flex-direction:row;align-items:center;gap:10px;">
      <span class="cat-icon" style="background:${meta.color}22;color:${meta.color};">${meta.icon}</span>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span class="merchant">${escapeHtml(t.merchant||"ไม่มีชื่อรายการ")}${t.isCard?'<span class="tag">บัตร</span>':''}</span>
        <span class="meta">${shortDate(t.date)} · ${t.category}</span>
      </div>
    </div>
    <span class="amount ${t.type}">${sign}฿${fmt(t.amount)}</span>
  </div>`;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const doQuickAdd = ()=>{
      const input = document.getElementById('quickAddInput');
      const parsed = parseQuickAdd(input.value);
      if(!parsed){ showToast("พิมพ์ให้มีจำนวนเงินด้วยนะคะ เช่น ข้าวแกง 50"); return; }
      saveTransaction({
        amount: parsed.amount, type: "expense",
        merchant: parsed.merchant,
        category: guessCategory(parsed.merchant),
        date: todayISO(), isCard: false, source: "quick"
      });
    };
    document.getElementById('quickAddBtn').onclick = doQuickAdd;
    document.getElementById('quickAddInput').onkeydown = (e)=>{ if(e.key==="Enter") doQuickAdd(); };

    document.querySelectorAll('.cat-chip').forEach(chip=>{
      chip.onclick = ()=>{
        const grid = chip.parentElement;
        grid.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        document.getElementById(grid.dataset.hiddenId).value = chip.dataset.cat;
      };
    });

    let manType="expense";
    const eB=document.getElementById('typeExpense'), iB=document.getElementById('typeIncome');
    const setType=(t)=>{ manType=t; eB.classList.toggle('sel-expense',t==='expense'); iB.classList.toggle('sel-income',t==='income'); };
    eB.onclick=()=>setType('expense'); iB.onclick=()=>setType('income');
    document.getElementById('manSaveBtn').onclick = ()=>{
      const amount = parseFloat(document.getElementById('manAmount').value);
      if(!amount || amount<=0){ showToast("ใส่จำนวนเงินก่อนนะคะ"); return; }
      saveTransaction({
        amount, type: manType,
        merchant: document.getElementById('manMerchant').value || "รายการ",
        category: document.getElementById('manCategory').value,
        date: document.getElementById('manDate').value || todayISO(),
        isCard: document.getElementById('manCard').checked,
        source: "manual"
      });
    };
  }

  if(activeTab==="dashboard"){
    const prev=document.getElementById('dashPrevMonth'), next=document.getElementById('dashNextMonth');
    if(prev) prev.onclick = ()=>{ dashMonth = shiftMonth(dashMonth,-1); render(); };
    if(next) next.onclick = ()=>{ dashMonth = shiftMonth(dashMonth,1); render(); };
    const toggleBtn = document.getElementById('toggleSummaryBtn');
    if(toggleBtn) toggleBtn.onclick = ()=>{ dashView = dashView==="list" ? "summary" : "list"; render(); };
    const pieB = document.getElementById('subViewPie'), trendB = document.getElementById('subViewTrend');
    if(pieB) pieB.onclick = ()=>{ summarySubView="pie"; render(); };
    if(trendB) trendB.onclick = ()=>{ summarySubView="trend"; render(); };
  }

  if(activeTab==="bills"){
    document.getElementById('prevMonth').onclick = ()=>{ state.currentBillMonth = shiftMonth(state.currentBillMonth,-1); render(); };
    document.getElementById('nextMonth').onclick = ()=>{ state.currentBillMonth = shiftMonth(state.currentBillMonth,1); render(); };

    document.querySelectorAll('[data-bill-field]').forEach(inp=>{
      inp.onchange = async ()=>{
        const bill = getOrCreateBill(state.currentBillMonth);
        bill[inp.dataset.billField] = parseFloat(inp.value)||0;
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-toggle-paid]').forEach(pill=>{
      pill.onclick = async ()=>{
        const bill = getOrCreateBill(state.currentBillMonth);
        if(bill.historical) return;
        const key = pill.dataset.togglePaid;
        bill.paid = bill.paid || {};
        bill.paid[key] = !bill.paid[key];
        await saveState(); render();
      };
    });
    const includesNes = document.getElementById('includesNes');
    if(includesNes) includesNes.onchange = async ()=>{
      const bill = getOrCreateBill(state.currentBillMonth);
      bill.includesNes = includesNes.checked;
      await saveState(); render();
    };
    const addPersonBtn = document.getElementById('addPersonBtn');
    if(addPersonBtn) addPersonBtn.onclick = async ()=>{
      const inp = document.getElementById('newPersonInput');
      const name = inp.value.trim();
      if(name){ state.settings.people.push(name); await saveState(); render(); }
    };
    document.querySelectorAll('[data-remove-person]').forEach(btn=>{
      btn.onclick = async ()=>{
        state.settings.people.splice(parseInt(btn.dataset.removePerson),1);
        await saveState(); render();
      };
    });
  }

  if(activeTab==="more"){
    document.querySelectorAll('[data-open]').forEach(item=>{
      item.onclick = ()=>{ moreView = item.dataset.open; render(); };
    });
    const back = document.getElementById('moreBack');
    if(back) back.onclick = ()=>{ moreView = "menu"; render(); };

    if(moreView==="recurring"){
      document.querySelectorAll('.cat-chip').forEach(chip=>{
        chip.onclick = ()=>{
          const grid = chip.parentElement;
          grid.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
          chip.classList.add('selected');
          document.getElementById(grid.dataset.hiddenId).value = chip.dataset.cat;
        };
      });
      const recSaveBtn = document.getElementById('recSaveBtn');
      if(recSaveBtn) recSaveBtn.onclick = async ()=>{
        const name = document.getElementById('recName').value.trim();
        if(!name){ showToast("ใส่ชื่อรายการก่อนนะคะ"); return; }
        const amtRaw = document.getElementById('recAmount').value;
        const day = parseInt(document.getElementById('recDay').value)||1;
        state.recurring.push({
          id: uid(), name,
          category: document.getElementById('recCategory').value,
          amount: amtRaw==="" ? null : parseFloat(amtRaw),
          day, enabled: true
        });
        await saveState();
        showToast("เพิ่มรายจ่ายประจำแล้ว");
        render();
      };
      document.querySelectorAll('[data-rec-toggle]').forEach(cb=>{
        cb.onchange = async ()=>{
          const r = state.recurring.find(x=>x.id===cb.dataset.recToggle);
          if(r){ r.enabled = cb.checked; await saveState(); }
        };
      });
      document.querySelectorAll('[data-rec-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          state.recurring = state.recurring.filter(x=>x.id!==btn.dataset.recDel);
          await saveState(); render();
        };
      });
    }

    if(moreView==="debts"){
      const oB=document.getElementById('debtTabOwe'), dB=document.getElementById('debtTabOwed');
      if(oB) oB.onclick = ()=>{ debtTab="owe"; render(); };
      if(dB) dB.onclick = ()=>{ debtTab="owed"; render(); };

      const debtSaveBtn = document.getElementById('debtSaveBtn');
      if(debtSaveBtn) debtSaveBtn.onclick = async ()=>{
        const person = document.getElementById('debtPerson').value.trim();
        const amount = parseFloat(document.getElementById('debtAmount').value);
        if(!person || !amount || amount<=0){ showToast("กรอกชื่อคนและจำนวนเงินให้ครบนะคะ"); return; }
        state.debts[debtTab].push({
          id: uid(), person, amount,
          lendDate: document.getElementById('debtLendDate').value || todayISO(),
          dueDate: document.getElementById('debtDueDate').value || null,
          settled: false
        });
        await saveState();
        showToast("เพิ่มรายการแล้ว");
        render();
      };
      document.querySelectorAll('[data-debt-settle]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = state.debts[debtTab].find(x=>x.id===btn.dataset.debtSettle);
          if(d){ d.settled = true; await saveState(); render(); }
        };
      });
      document.querySelectorAll('[data-debt-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          state.debts[debtTab] = state.debts[debtTab].filter(x=>x.id!==btn.dataset.debtDel);
          await saveState(); render();
        };
      });
    }
  }
}

function shiftMonth(mk, delta){
  const [y,m] = mk.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return monthKey(d);
}

async function saveTransaction(tx){
  tx.id = uid();
  state.transactions.push(tx);
  await saveState();
  showToast("บันทึกรายการแล้ว");
  activeTab = "dashboard";
  render();
}

/* ============ INIT ============ */
(async function init(){
  document.getElementById('view').innerHTML = `<div class="empty">กำลังโหลด...</div>`;
  await loadState();
  render();
})();
</script>
