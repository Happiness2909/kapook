<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBEEEA;
    --surface:#FFFFFF;
    --ink:#4A3626;
    --ink-soft:#8C7A68;
    --line:#F0DFD9;
    --jade:#6E7F3F;
    --jade-soft:#E7EBDA;
    --gold:#8A5A3C;
    --gold-soft:#EDE1D6;
    --rust:#D9756B;
    --rust-soft:#FBE3E1;
    --pink:#F2A7A0;
    --pink-dark:#DE8078;
    --pink-soft:#FCE9E7;
    --grad:linear-gradient(160deg, #F2A7A0 0%, #DE8078 100%);
    --grad-gold:linear-gradient(160deg, #EDE1D6 0%, #8A5A3C 100%);
    --grad-jade:linear-gradient(160deg, #E7EBDA 0%, #6E7F3F 100%);
    --radius:22px;
    --doodle:none;
    --doodle-shadow:0 4px 16px rgba(74,59,51,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:0 14px 100px;}
  h1,h2,h3{font-family:'Mali',cursive;margin:0;}
  .header{
    background:var(--grad);
    color:var(--ink);
    border:var(--doodle);border-top:none;
    border-radius:0 0 26px 26px;
    padding:22px 18px 26px;
    margin:0 -14px 18px;
    display:flex;align-items:baseline;justify-content:space-between;
  }
  .header h1{font-size:23px;font-weight:700;}
  .header .sub{font-size:12px;color:rgba(74,59,51,.7);}
  .header.theme-gold{background:var(--grad-gold);}
  .header.theme-jade{background:var(--grad-jade);}

  /* Bottom tab nav */
  .tabs{
    display:flex;align-items:flex-end;gap:2px;background:var(--surface);
    box-shadow:0 -4px 16px rgba(74,59,51,.08);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    max-width:720px;margin:0 auto;border-radius:22px 22px 0 0;
  }
  .tab{
    flex:1;text-align:center;padding:8px 4px 6px;font-size:11px;font-weight:500;
    border-radius:14px;cursor:pointer;color:var(--ink-soft);user-select:none;
    transition:background .15s, color .15s;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .tab .icon{font-size:18px;line-height:1;}
  .tab.active{background:var(--gold-soft);color:var(--gold);}
  .tab.tab-fab{margin-top:-28px;}
  .tab.tab-fab .icon{
    width:54px;height:54px;border-radius:18px;background:var(--grad);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    border:var(--doodle);box-shadow:0 3px 12px rgba(74,59,51,.18);
  }
  .tab.tab-fab.active .icon{background:var(--grad);}
  .tab.tab-fab.active{background:none;color:var(--pink-dark);}

  .card{
    background:var(--surface);border:var(--doodle);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;box-shadow:var(--doodle-shadow);
  }
  .card + .card{margin-top:14px;}
  .section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--ink-soft);font-size:12.5px;}

  /* Dashboard stat row */
  .stat-row{display:flex;gap:12px;margin-bottom:14px;}
  .stat{flex:1;background:var(--surface);border:var(--doodle);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(74,59,51,.15);}
  .stat .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .stat .value{font-size:20px;font-weight:700;font-family:'Mali',cursive;}
  .stat.income .value{color:var(--jade);}
  .stat.expense .value{color:var(--rust);}

  .hero-balance{
    background:var(--grad);border:var(--doodle);border-radius:var(--radius);padding:22px 20px;margin-bottom:12px;
    color:var(--ink);text-align:center;box-shadow:var(--doodle-shadow);position:relative;
  }
  .hero-balance .lbl{font-size:12.5px;color:rgba(74,59,51,.7);margin-bottom:6px;}
  .hero-balance .amt{font-family:'Mali',cursive;font-weight:700;font-size:34px;}
  .mascot{position:absolute;top:-14px;right:10px;}

  .greeting{font-family:'Mali',cursive;font-weight:700;font-size:19px;margin:14px 0 10px;cursor:pointer;color:var(--ink);}

  .due-stack{position:relative;height:150px;margin:6px 0 18px;}
  .due-card{
    position:absolute;top:0;width:188px;
    background:var(--surface);border:var(--doodle);border-radius:16px;padding:13px;
    box-shadow:0 3px 12px rgba(74,59,51,.15);cursor:pointer;
  }
  .due-card .ic{font-size:22px;}
  .due-card .lbl{font-size:12.5px;font-weight:600;margin-top:6px;line-height:1.3;}
  .due-card .amt{font-size:13px;font-family:'Mali',cursive;font-weight:700;margin-top:2px;color:var(--rust);}
  .due-stack-more{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  /* Receipt-style transaction list */
  .receipt-list{}
  .receipt-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 2px;border-bottom:1px dashed var(--line);
  }
  .receipt-row:last-child{border-bottom:none;}
  .receipt-row .left{display:flex;flex-direction:column;gap:2px;}
  .receipt-row .merchant{font-size:14px;font-weight:500;}
  .receipt-row .meta{font-size:11.5px;color:var(--ink-soft);}
  .receipt-row .amount{font-size:14.5px;font-weight:700;font-family:'Mali',cursive;}
  .amount.expense{color:var(--rust);}
  .amount.income{color:var(--jade);}
  .tag{
    display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:8px;
    background:var(--gold-soft);color:var(--gold);margin-left:6px;
  }

  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}

  .cat-icon{
    width:38px;height:38px;min-width:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:17px;
  }
  .pie{width:170px;height:170px;border-radius:50%;margin:6px auto 18px;}

  .ring-wrap{position:relative;margin:6px auto 4px;}
  .ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .ring-center .num{font-family:'Mali',cursive;font-weight:700;font-size:22px;line-height:1;}
  .ring-center .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .icon-bubble{
    position:absolute;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(74,59,51,.15);
  }
  .legend{display:flex;flex-direction:column;gap:9px;margin:18px 0 4px;}
  .legend-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--paper);}
  .legend-item .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
  .legend-item .nm{flex:1;font-size:13px;font-weight:500;}
  .legend-item .pct{font-size:12px;color:var(--ink-soft);width:38px;text-align:right;}
  .legend-item .amt{font-family:'Mali',cursive;font-weight:700;font-size:13px;width:78px;text-align:right;}
  .pie-legend{display:flex;flex-direction:column;gap:9px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .legend-row .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .legend-cat{flex:1;}
  .legend-pct{color:var(--ink-soft);width:44px;text-align:right;}
  .legend-amt{width:88px;text-align:right;font-weight:600;font-family:'Mali',cursive;}

  .cat-bar-row{margin-bottom:14px;}
  .cat-bar-row:last-of-type{margin-bottom:0;}
  .cat-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;}
  .cat-bar-top .name{font-weight:500;}
  .cat-bar-top .amt{color:var(--ink-soft);font-weight:600;font-size:12.5px;}
  .cat-bar-track{height:9px;border-radius:8px;background:var(--paper);overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:8px;}

  /* Quick add screen */
  .amount-big{

<script>
/* ============ CONFIG ============ */
const CATEGORIES = ["Food","Travel","Shopping etc.","Home Shopping","Concert","Health","Tennis","Dog","Cat","Other"];
const CATEGORY_META = {
  "Food":           {icon:"🍜", color:"#E07A5F"},

};
// old Thai category names map to the new English ones, so any data saved
// before this rename still shows the right icon/color instead of falling
// back to "Other"
const CATEGORY_ALIASES = {
  "อาหาร":"Food", "เดินทาง":"Travel", "ช้อปปิ้งจิปาถะ":"Shopping etc.",
  "ของเข้าบ้าน":"Home Shopping", "คอนเสิร์ต/ศิลปิน":"Concert", "สุขภาพ":"Health",
  "หมา":"Dog", "แมว":"Cat", "อื่นๆ":"Other", "รายรับ":"Income"
};
function catMeta(c){ c = CATEGORY_ALIASES[c] || c; return CATEGORY_META[c] || CATEGORY_META["Other"]; }

const MASCOT_SVG = `<svg width="46" height="46" viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">
  <rect x="3" y="3" width="40" height="40" rx="14" fill="#F9D7D7" stroke="#4A3B33" stroke-width="3"/>
  <circle cx="17" cy="20" r="2.6" fill="#4A3B33"/>
  <circle cx="29" cy="20" r="2.6" fill="#4A3B33"/>
  <path d="M16 27 Q23 33 30 27" stroke="#4A3B33" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>`;
const CATEGORY_KEYWORDS = {
  "Food": ["ร้านอาหาร","cafe","coffee","กาแฟ","food","restaurant","7-eleven","เซเว่น","starbucks","kfc","mcdonald","ตลาด","ข้าว","ก๋วยเตี๋ยว"],
  "Travel": ["grab","taxi","แท็กซี่","bts","mrt","น้ำมัน","ปตท","bangchak","เดินทาง"],
  "Shopping etc.": ["shopee","lazada","shop","ช้อป","store","mall","จิปาถะ"],
  "Home Shopping": ["โฮมโปร","ไทวัสดุ","บิ๊กซี","โลตัส","ของใช้ในบ้าน","เครื่องใช้ไฟฟ้า","ซุปเปอร์มาร์เก็ต"],
  "Concert": ["คอนเสิร์ต","concert","บัตรคอน","fanmeeting","แฟนมีต","merch","อัลบั้ม"],
  "Health": ["โรงพยาบาล","clinic","คลินิก","pharmacy","ยา"],
  "Tennis": ["เทนนิส","tennis","คอร์ท","ลูกเทนนิส"],
  "Dog": ["หมา","สุนัข","dog","อาหารหมา"],
  "Cat": ["แมว","cat","อาหารแมว","ทรายแมว"]
};
const BILL_FIELDS = [
  {key:"house", label:"ค่าบ้าน", icon:"🏠"},
  {key:"water", label:"ค่าน้ำ", icon:"💧"},
  {key:"electric", label:"ค่าไฟ", icon:"⚡"},
  {key:"net", label:"ค่าเน็ต", icon:"📶"},
  {key:"gas", label:"ค่าน้ำมัน", icon:"⛽"}
];

/* Seed history from Nes's spreadsheet (Share_House_Budget.xlsx), read-only reference, 3-way split historically */
const SEED_BILLS = [
  /* historical reference data removed for privacy before hosting this file at a public URL —
     if you want it back, re-enter your past months manually in the "ค่าน้ำค่าไฟ" tab; that data
     stays only in your own browser (localStorage), never in this shared file. */
].map(r=>({
  month:r[0],
  house:r[1],water:r[2],electric:r[3],net:r[4],gas:r[5],
  people:3, includesNes:false, historical:true,
  paid:{house:true,water:true,electric:true,net:true,gas:true}
}));

/* ============ STATE ============ */
let state = {
  transactions: [], // {id,date,amount,type,category,merchant,source,isCard,note}
  bills: {},        // month -> {house,water,electric,net,gas,people,includesNes,paid:{}}
  settings: { people: ["T","P"], userName: "" },
  currentBillMonth: monthKey(new Date()),
  recurring: [],     // {id,name,category,amount(or null="ไม่แน่นอน"),day,enabled}
  debts: { owe: [], owed: [] }, // each: {id,person,amount,lendDate,dueDate,settled}
  sync: { sheetUrl: null, userId: null }, // connects to the same Google Sheet the LINE bot writes to
  billGroups: {
    personal: {
      items: [
        {id:"dad-water", name:"ค่าน้ำ", icon:"👨", fixed:true, enabled:true},
        {id:"dad-electric", name:"ค่าไฟ", icon:"👨", fixed:true, enabled:true},
        {id:"phone", name:"ค่ามือถือ", icon:"📱", fixed:true, enabled:true},
        {id:"netflix", name:"Netflix", icon:"🎬", fixed:true, enabled:true},
        {id:"home-net", name:"เน็ตบ้าน", icon:"📶", fixed:true, enabled:true},
        {id:"shopee", name:"Shopee", icon:"🛍️", fixed:true, enabled:true},
        {id:"tiktok", name:"TikTok", icon:"🎵", fixed:true, enabled:true},
        {id:"dca-stashaway", name:"StashAway", icon:"🐷", isSaving:true, fixed:true, enabled:true},
        {id:"dca-dime", name:"Dime", icon:"🐷", isSaving:true, fixed:true, enabled:true},
        {id:"dca-kept", name:"Kept", icon:"🐷", isSaving:true, fixed:true, enabled:true}
      ],
      months: {}
    },
    car: {
      items: [
        {id:"loan", name:"ค่าผ่อนรถ", icon:"🚗", fixed:true, enabled:true}
      ],
      months: {},
      chargingLog: [],
      annualItems: [
        {id:"tax", name:"พรบ./ภาษี", icon:"📄", fixed:true, enabled:true},
        {id:"insurance", name:"ค่าประกันรถ", icon:"🛡️", fixed:true, enabled:true}
      ],
      annualYears: {}
    }
  },
  _demoActive: false,
  _demoBackup: null
};
let activeTab = "dashboard";
let dashMonth = monthKey(new Date());
let dashView = "list"; // "list" | "summary"
let summarySubView = "pie"; // "pie" | "trend"
let moreView = "menu"; // "menu" | "recurring" | "debts" | "sync"
let debtTab = "owe"; // "owe" | "owed"
let syncStatus = ""; // transient status message on the sync screen
let keypadAmount = "0"; // current value being entered on the numeric keypad

function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabelTH(key){
  const months=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const [y,m]=key.split("-"); return months[parseInt(m)-1]+" "+y;
}
function fmt(n){ return (n<0?"-":"")+Math.abs(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ============ STORAGE (localStorage — works in any standalone browser) ============ */
async function loadState(){
  try{
    const raw = localStorage.getItem('finance-tracker-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){ /* no data yet */ }
  // seed bills history only once, non-destructively
  let seeded=false;
  SEED_BILLS.forEach(b=>{
    if(!state.bills[b.month]){ state.bills[b.month]=b; seeded=true; }
  });
  if(seeded) await saveState();

  // if connected to the shared Google Sheet, that sheet becomes the source of
  // truth for transactions (so entries logged via the LINE bot show up here too)
  if(state.sync.sheetUrl && state.sync.userId){
    try{
      const remote = await fetchRemoteTransactions();
      state.transactions = remote.map(r => ({
        id: "sheet-" + (r.timestamp || uid()),
        date: r.date, type: r.type, category: r.category,
        merchant: r.merchant, amount: r.amount,
        isCard: false, source: "sync"
      }));
    }catch(e){ showToast("ดึงข้อมูลจาก Google Sheet ไม่สำเร็จ ใช้ข้อมูลในเครื่องแทน"); }
  }
}
async function saveState(){
  try{
    localStorage.setItem('finance-tracker-data', JSON.stringify(state));
  }catch(e){ showToast("บันทึกไม่สำเร็จ พื้นที่เก็บข้อมูลในเบราว์เซอร์อาจเต็ม"); }
}

/* ============ SHEET SYNC (shared with the LINE bot) ============ */
async function fetchRemoteTransactions(){
  const url = `${state.sync.sheetUrl}?action=list&userId=${encodeURIComponent(state.sync.userId)}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.transactions || [];
}
async function pushTransactionToSheet(tx){
  // text/plain avoids a CORS preflight that Google Apps Script doesn't handle
  await fetch(state.sync.sheetUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      action: "add", userId: state.sync.userId,
      date: tx.date, type: tx.type, category: tx.category,
      merchant: tx.merchant, amount: tx.amount
    })
  });
}

/* ============ CATEGORY GUESS ============ */
function guessCategory(text){
  if(!text) return "Other";
  const low=text.toLowerCase();
  for(const [cat,words] of Object.entries(CATEGORY_KEYWORDS)){
    if(words.some(w=>low.includes(w.toLowerCase()))) return cat;
  }
  return "Other";
}

function parseQuickAdd(text){
  text = (text||"").trim();
  if(!text) return null;
  let m = text.match(/^(.*?)\s*([\d,]+(?:\.\d+)?)\s*(?:บาท)?$/);
  let merchant, amount;
  if(m && m[2]!==undefined && m[2]!==""){
    merchant = m[1].trim();
    amount = parseFloat(m[2].replace(/,/g,""));
  }
  if(!amount){
    m = text.match(/^([\d,]+(?:\.\d+)?)\s*(?:บาท)?\s*(.*)$/);
    if(m && m[1]){
      amount = parseFloat(m[1].replace(/,/g,""));
      merchant = m[2].trim();
    }
  }
  if(!amount || isNaN(amount) || amount<=0) return null;
  return { amount, merchant: merchant || "รายการ" };
}

/* ============ DASHBOARD ============ */
function isoWeekStart(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = (d.getDay()+6)%7; // Mon=0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function shortDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.getDate()+"/"+(d.getMonth()+1);
}
function weekRangeLabel(weekStart){
  const s = new Date(weekStart+"T00:00:00");
  const e = new Date(s); e.setDate(e.getDate()+6);
  return shortDate(weekStart)+" – "+shortDate(e.toISOString().slice(0,10));
}

function attachDueStackSwipe(){
  const stack = document.getElementById('dueStack');
  if(!stack) return;
  let startX = 0, dragging = false, moved = false;
  stack.addEventListener('pointerdown', e=>{ startX = e.clientX; dragging = true; moved = false; });
  stack.addEventListener('pointermove', e=>{
    if(!dragging) return;
    if(Math.abs(e.clientX - startX) > 10) moved = true;
  });
  stack.addEventListener('pointerup', e=>{
    if(!dragging) return;
    dragging = false;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 40 && lastDueCardsTotal > 1){
      dueCardOffset += (dx < 0) ? 1 : -1;
      dueStackDragged = true;
      setTimeout(()=>{ dueStackDragged = false; }, 300); // safety reset in case no click follows
      render();
    } else {
      moved = false;
    }
  });
  stack.addEventListener('pointercancel', ()=>{ dragging = false; });
}

function getDueBillCards(){
  const mk = monthKey(new Date());
  const cards = [];

  const rBill = state.bills[mk];
  if(rBill && !rBill.historical){
    BILL_FIELDS.forEach(f=>{
      const amt = Number(rBill[f.key])||0;
      const paid = rBill.paid && rBill.paid[f.key];
      if(!paid && !amt){
        cards.push({ icon:f.icon, label:f.label, amount:amt, target:"bills", space:"ratchaburi" });
      }
    });
  }

  const pMonth = getOrCreateGroupMonth("personal", mk);
  state.billGroups.personal.items.forEach(it=>{
    const d = pMonth[it.id];
    if(d && !d.paid && !d.amount && !it.isSaving && it.enabled!==false){
      cards.push({ icon:it.icon, label:it.name, amount:d.amount||0, target:"bills", space:"personal" });
    }
  });

  const cMonth = getOrCreateGroupMonth("car", mk);
  state.billGroups.car.items.forEach(it=>{

    if(d && !d.paid && !d.amount && it.enabled!==false){
      cards.push({ icon:it.icon, label:it.name, amount:d.amount||0, target:"car" });
    }
  });

  return cards;
}

function renderWeeklyList(monthTx){
  const sorted = [...monthTx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));

  }
  const groups = []; // {weekStart, items:[]}
  sorted.forEach(t=>{
    const ws = isoWeekStart(t.date);
    let g = groups[groups.length-1];
    if(!g || g.weekStart!==ws){ g={weekStart:ws, items:[]}; groups.push(g); }
    g.items.push(t);
  });
  return groups.map(g=>{
    const subtotal = g.items.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
    return `<div class="card">

}

function renderCategoryRing(entries, grand){
  const SIZE=240, CX=120, CY=120, R=88, STROKE=16, GAP_DEG=12;
  const circumference = 2*Math.PI*R;
  const totalGap = entries.length * GAP_DEG;
  const availableDeg = Math.max(0, 360 - totalGap);
  let cumulative = 0;
  let svg = `<svg width="${SIZE}" height="${SIZE}" viewBox="0 0 ${SIZE} ${SIZE}">`;
  const bubbles = [];
  entries.forEach(([cat,amt])=>{
    const meta = catMeta(cat);
    const segDeg = (amt/grand) * availableDeg;
    const arcLen = circumference * (segDeg/360);
    const dashArray = `${arcLen} ${circumference-arcLen}`;
    const dashOffset = -(circumference * (cumulative/360));
    svg += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${meta.color}"
             stroke-width="${STROKE}" stroke-linecap="round"
             stroke-dasharray="${dashArray}" stroke-dashoffset="${dashOffset}"
             transform="rotate(-90 ${CX} ${CY})"/>`;
    const midDeg = cumulative + segDeg/2;
    const mathAngle = (midDeg-90) * Math.PI/180;
    bubbles.push({ x: CX+R*Math.cos(mathAngle), y: CY+R*Math.sin(mathAngle), icon: meta.icon, color: meta.color });
    cumulative += segDeg + GAP_DEG;
  });
  svg += `</svg>`;
  return `<div class="ring-wrap" style="width:${SIZE}px;height:${SIZE}px;">
    ${svg}
    ${bubbles.map(b=>`<div class="icon-bubble" style="left:${b.x}px;top:${b.y}px;background:${b.color}22;">${b.icon}</div>`).join("")}
    <div class="ring-center"><div class="num">฿${fmt(grand)}</div><div class="lbl">รายจ่ายเดือนนี้</div></div>
  </div>`;
}

}

function getOrCreateBill(mk){
  if(!state.bills[mk]){
    state.bills[mk] = {month:mk, house:0,water:0,electric:0,net:0,gas:0, people:state.settings.people.length, includesNes:false, paid:{house:false,water:false,electric:false,net:false,gas:false}};
  }
  return state.bills[mk];
}
let billSpace = "ratchaburi"; // "ratchaburi" | "personal"
let billGroupMonth = { personal: monthKey(new Date()), car: monthKey(new Date()) };
let billGroupYear = { car: new Date().getFullYear() };
let ratchaburiHistoryYear = new Date().getFullYear();
let dueCardOffset = 0; // which unpaid-bill card is currently front-most in the swipeable stack
let lastDueCardsTotal = 0;
let dueStackDragged = false; // true right after a swipe, to suppress the resulting click-to-navigate

function renderBills(){
  const switcher = `
    <div class="type-toggle" style="margin-bottom:14px;">
      <button type="button" id="spaceRatchaburi" class="${billSpace==='ratchaburi'?'sel-income':''}" style="flex:${billSpace==='ratchaburi'?'3':'0 0 52px'};overflow:hidden;white-space:nowrap;">🏠${billSpace==='ratchaburi'?' Ratchaburi House':''}</button>
      <button type="button" id="spacePersonal" class="${billSpace==='personal'?'sel-expense':''}" style="flex:${billSpace==='personal'?'3':'0 0 52px'};overflow:hidden;white-space:nowrap;">👤${billSpace==='personal'?' Personal':''}</button>
    </div>
  `;
  if(billSpace==="personal") return switcher + renderBillGroup("personal");
  return switcher + renderRatchaburiBills();

function getOrCreateGroupMonth(groupKey, mk){
  const g = state.billGroups[groupKey];
  if(!g.months[mk]) g.months[mk] = {};
  g.items.forEach(it=>{
    if(!g.months[mk][it.id]) g.months[mk][it.id] = { amount:0, paid:false };
  });
  return g.months[mk];
}

function getOrCreateGroupYear(groupKey, year){
  const g = state.billGroups[groupKey];
  if(!g.annualYears) g.annualYears = {};
  if(!g.annualYears[year]) g.annualYears[year] = {};
  (g.annualItems||[]).forEach(it=>{
    if(!g.annualYears[year][it.id]) g.annualYears[year][it.id] = { amount:0, paid:false };
  });
  return g.annualYears[year];
}

function renderAnnualItems(groupKey){
  const g = state.billGroups[groupKey];
  if(!g.annualItems || !g.annualItems.length) return "";
  const year = billGroupYear[groupKey];
  const yearData = getOrCreateGroupYear(groupKey, year);
  const total = g.annualItems.reduce((s,it)=>s+(Number(yearData[it.id].amount)||0),0);
  return `
    <div class="card">

      <div class="month-nav" style="margin-bottom:10px;">

        <div class="current">ปี ${year}</div>
        <button data-group-year-next="${groupKey}">›</button>
      </div>
      ${g.annualItems.map(it=>{
        const d = yearData[it.id];
        return `<div class="bill-line">
          <span class="name" style="font-size:12.5px;">${it.icon||""} ${escapeHtml(it.name)}</span>
          <div class="bill-line-controls">
            <input type="number" class="amt-input amt-input-sm" data-group-year="${groupKey}" data-item="${it.id}" value="${d.amount||0}" step="0.01">

            <button class="icon-btn icon-btn-sm" data-group-year-item-edit="${groupKey}:${it.id}">✏️</button>
            <button class="icon-btn icon-btn-sm" data-group-year-item-del="${groupKey}:${it.id}">🗑️</button>

        <span style="font-weight:600;font-family:'Mali',cursive;">฿${fmt(total)}</span>

    </div>
  `;
}

function renderBillItemRow(groupKey, it, d){
  const paidLabel = it.isSaving ? (d.paid?"ออมแล้ว":"ยังไม่ออม") : (d.paid?"จ่ายแล้ว":"ยังไม่จ่าย");

function attachBillGroupHandlers(){
  const chargeAddBtn = document.getElementById('chargeAddBtn');
  if(chargeAddBtn) chargeAddBtn.onclick = async ()=>{
    const dateInp = document.getElementById('chargeDate');
    const amtInp = document.getElementById('chargeAmount');
    const amount = parseFloat(amtInp.value);
    if(!amount || amount<=0){ showToast("ใส่ยอดเงินก่อนนะคะ"); return; }
    state.billGroups.car.chargingLog = state.billGroups.car.chargingLog || [];
    state.billGroups.car.chargingLog.push({ id: uid(), date: dateInp.value || todayISO(), amount });
    await saveState(); render();
  };
  document.querySelectorAll('[data-charge-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      state.billGroups.car.chargingLog = (state.billGroups.car.chargingLog||[]).filter(e=>e.id!==btn.dataset.chargeDel);
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-prev]').forEach(btn=>{
    btn.onclick = ()=>{ const g=btn.dataset.groupPrev; billGroupMonth[g]=shiftMonth(billGroupMonth[g],-1); render(); };
  });
  document.querySelectorAll('[data-group-next]').forEach(btn=>{
    btn.onclick = ()=>{ const g=btn.dataset.groupNext; billGroupMonth[g]=shiftMonth(billGroupMonth[g],1); render(); };
  });
  document.querySelectorAll('[data-group-year-prev]').forEach(btn=>{
    btn.onclick = ()=>{ const g=btn.dataset.groupYearPrev; billGroupYear[g]--; render(); };
  });
  document.querySelectorAll('[data-group-year-next]').forEach(btn=>{
    btn.onclick = ()=>{ const g=btn.dataset.groupYearNext; billGroupYear[g]++; render(); };
  });
  document.querySelectorAll('.amt-input[data-group]').forEach(inp=>{
    inp.onchange = async ()=>{
      const g = inp.dataset.group, itemId = inp.dataset.item;
      const monthData = getOrCreateGroupMonth(g, billGroupMonth[g]);
      monthData[itemId].amount = parseFloat(inp.value)||0;
      await saveState(); render();
    };
  });
  document.querySelectorAll('.amt-input[data-group-year]').forEach(inp=>{
    inp.onchange = async ()=>{
      const g = inp.dataset.groupYear, itemId = inp.dataset.item;
      const yearData = getOrCreateGroupYear(g, billGroupYear[g]);
      yearData[itemId].amount = parseFloat(inp.value)||0;
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-toggle]').forEach(pill=>{
    pill.onclick = async ()=>{
      const [g, itemId] = pill.dataset.groupToggle.split(":");
      const monthData = getOrCreateGroupMonth(g, billGroupMonth[g]);
      monthData[itemId].paid = !monthData[itemId].paid;
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-year-toggle]').forEach(pill=>{
    pill.onclick = async ()=>{
      const [g, itemId] = pill.dataset.groupYearToggle.split(":");
      const yearData = getOrCreateGroupYear(g, billGroupYear[g]);
      yearData[itemId].paid = !yearData[itemId].paid;
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-item-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [g, itemId] = btn.dataset.groupItemDel.split(":");
      if(!confirm("ลบรายการนี้ใช่ไหมคะ")) return;
      state.billGroups[g].items = state.billGroups[g].items.filter(it=>it.id!==itemId);
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-item-edit]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [g, itemId] = btn.dataset.groupItemEdit.split(":");
      const it = state.billGroups[g].items.find(x=>x.id===itemId);
      if(!it) return;
      const newName = prompt("แก้ชื่อรายการ", it.name);
      if(newName===null) return;
      const trimmed = newName.trim();
      if(!trimmed){ showToast("ชื่อรายการห้ามว่างนะคะ"); return; }
      it.name = trimmed;
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-year-item-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [g, itemId] = btn.dataset.groupYearItemDel.split(":");
      if(!confirm("ลบรายการนี้ใช่ไหมคะ")) return;
      state.billGroups[g].annualItems = state.billGroups[g].annualItems.filter(it=>it.id!==itemId);
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-year-item-edit]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [g, itemId] = btn.dataset.groupYearItemEdit.split(":");
      const it = state.billGroups[g].annualItems.find(x=>x.id===itemId);
      if(!it) return;
      const newName = prompt("แก้ชื่อรายการ", it.name);
      if(newName===null) return;
      const trimmed = newName.trim();
      if(!trimmed){ showToast("ชื่อรายการห้ามว่างนะคะ"); return; }
      it.name = trimmed;
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-group-item-add]').forEach(btn=>{
    btn.onclick = async ()=>{
      const g = btn.dataset.groupItemAdd;
      const iconInp = document.getElementById('groupItemIcon-'+g);
      const nameInp = document.getElementById('groupItemName-'+g);
      const name = nameInp.value.trim();
      if(!name){ showToast("ใส่ชื่อรายการก่อนนะคะ"); return; }
      state.billGroups[g].items.push({ id: uid(), name, icon: iconInp.value.trim() || "📌" });
      await saveState(); render();
    };
  });
}

function renderRatchaburiHistory(){
  const year = ratchaburiHistoryYear;
  const monthKeys = [];
  for(let m=1;m<=12;m++){ monthKeys.push(year+"-"+String(m).padStart(2,"0")); }
  const data = monthKeys.map(mk=>{
    const b = state.bills[mk];
    return {
      mk,
      water: b ? Number(b.water)||0 : 0,
      electric: b ? Number(b.electric)||0 : 0,
      total: b ? BILL_FIELDS.reduce((s,f)=>s+(Number(b[f.key])||0),0) : null
    };
  });
  const maxVal = Math.max(1, ...data.flatMap(d=>[d.water,d.electric]));
  const hasAnyData = data.some(d=>d.total!==null);

  return `
    <div class="card">
      <div class="section-title">ย้อนหลัง</div>
      <div class="month-nav" style="margin-bottom:10px;">
        <button id="historyYearPrev">‹</button>
        <div class="current">ปี ${year}</div>
        <button id="historyYearNext">›</button>
      </div>
      ${hasAnyData ? `
        <div class="trend-legend">
          <span><span class="dot" style="background:#3D5A80;"></span>ค่าน้ำ</span>
          <span><span class="dot" style="background:#E0954D;"></span>ค่าไฟ</span>
        </div>
        <div class="trend-chart">
          ${data.map(d=>`
            <div class="trend-col">
              <div class="trend-bars">
                <div class="bar" style="height:${Math.round(d.water/maxVal*100)}%;background:#3D5A80;"></div>
                <div class="bar" style="height:${Math.round(d.electric/maxVal*100)}%;background:#E0954D;"></div>
              </div>
              <span class="lbl">${monthLabelTH(d.mk).split(" ")[0]}</span>
            </div>
          `).join("")}
        </div>
        <div class="receipt-list" style="margin-top:6px;">
          ${data.filter(d=>d.total!==null).slice().reverse().map(d=>`<div class="history-row"><span class="m">${monthLabelTH(d.mk)}</span><span>฿${fmt(d.total)}</span></div>`).join("")}
        </div>
      ` : `<div class="empty">ยังไม่มีข้อมูลปี ${year}</div>`}
    </div>
  `;
}

  if(moreView==="recurring") return renderRecurring();
  if(moreView==="debts") return renderDebts();

  const today = todayISO();
  return `
    <div class="back-row" id="moreBack">‹ กลับ</div>
    <div class="type-toggle" style="margin-bottom:14px;">
      <button type="button" id="debtTabOwe" class="${debtTab==='owe'?'sel-expense':''}">หนี้ของฉัน</button>
      <button type="button" id="debtTabOwed" class="${debtTab==='owed'?'sel-income':''}">ลูกหนี้</button>
    </div>
    <div class="card">

      <div style="font-family:'Mali',cursive;font-size:26px;font-weight:700;color:${debtTab==='owe'?'var(--rust)':'var(--jade)'};">฿${fmt(total)}</div>

        return `

            <div>
              <span class="person">${escapeHtml(d.person)}</span>
              ${overdue ? '<span class="overdue-tag">เกินกำหนด</span>' : ''}

              <div class="dates">${d.lendDate?('ให้ยืม '+d.lendDate+' · '):''}${d.dueDate?('นัดคืน '+d.dueDate):'ไม่ระบุกำหนด'}</div>

          <div class="debt-actions">
            ${!d.settled ? `<button class="btn-settle" data-debt-settle="${d.id}">${debtTab==='owe'?'ชำระหนี้':'รับเงิน'}</button>` : ''}
            <button class="icon-btn" style="border:1px solid var(--line);border-radius:4px;" data-debt-del="${d.id}">🗑️</button>

      }).join("") : `<div class="empty">ยังไม่มีรายการ</div>`}

    <div class="card">
      <div class="section-title">เพิ่มรายการ</div>
      <label>ชื่อคน</label>
      <input type="text" id="debtPerson" placeholder="เช่น เพื่อน">
      <label>จำนวนเงิน</label>
      <input type="number" id="debtAmount" placeholder="0.00" step="0.01">
      <label>วันที่ให้ยืม/วันที่กู้</label>
      <input type="date" id="debtLendDate" value="${todayISO()}">
      <label>นัดคืน (ถ้ามี)</label>
      <input type="date" id="debtDueDate">
      <button class="btn btn-primary" id="debtSaveBtn">เพิ่มรายการ</button>
    </div>
  `;
}

/* ============ EVENT HANDLERS ============ */
function attachHandlers(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ activeTab=t.dataset.tab; render(); };
  });

  if(activeTab==="add"){
    document.querySelectorAll('.cat-chip').forEach(chip=>{
      chip.onclick = ()=>{
        const grid = chip.parentElement;
        grid.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        document.getElementById(grid.dataset.hiddenId).value = chip.dataset.cat;
      };
    });

    const keypadDisplay = document.getElementById('keypadDisplay');
    document.querySelectorAll('.key-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const k = btn.dataset.key;
        if(k==="back"){
          keypadAmount = keypadAmount.length>1 ? keypadAmount.slice(0,-1) : "0";
        } else if(k==="."){
          if(!keypadAmount.includes(".")) keypadAmount += ".";
        } else {
          const parts = keypadAmount.split(".");
          if(parts[1] && parts[1].length>=2) return; // max 2 decimal places
          keypadAmount = (keypadAmount==="0") ? k : keypadAmount + k;
        }
        if(keypadDisplay) keypadDisplay.textContent = "฿" + keypadAmount;
      };
    });

    const dateToggle = document.getElementById('manDateToggle');
    const dateInput = document.getElementById('manDate');
    if(dateToggle) dateToggle.onclick = ()=>{
      const showing = dateInput.style.display !== "none";
      dateInput.style.display = showing ? "none" : "block";
      dateToggle.classList.toggle('active', !showing);
    };
    const cardToggle = document.getElementById('manCardToggle');
    if(cardToggle) cardToggle.onclick = ()=>{ cardToggle.classList.toggle('active'); };

    let manType="expense";
    const eB=document.getElementById('typeExpense'), iB=document.getElementById('typeIncome');
    const setType=(t)=>{ manType=t; eB.classList.toggle('sel-expense',t==='expense'); iB.classList.toggle('sel-income',t==='income'); };
    eB.onclick=()=>setType('expense'); iB.onclick=()=>setType('income');
    document.getElementById('manSaveBtn').onclick = ()=>{
      const amount = parseFloat(keypadAmount);
      if(!amount || amount<=0){ showToast("ใส่จำนวนเงินก่อนนะคะ"); return; }
      saveTransaction({
        amount, type: manType,
        merchant: document.getElementById('manMerchant').value || "รายการ",
        category: document.getElementById('manCategory').value,
        date: document.getElementById('manDate').value || todayISO(),
        isCard: cardToggle ? cardToggle.classList.contains('active') : false,
        source: "manual"
      });
    };
  }

  if(activeTab==="dashboard"){
    const prev=document.getElementById('dashPrevMonth'), next=document.getElementById('dashNextMonth');
    if(prev) prev.onclick = ()=>{ dashMonth = shiftMonth(dashMonth,-1); render(); };
    if(next) next.onclick = ()=>{ dashMonth = shiftMonth(dashMonth,1); render(); };
    const toggleBtn = document.getElementById('toggleSummaryBtn');
    if(toggleBtn) toggleBtn.onclick = ()=>{ dashView = dashView==="list" ? "summary" : "list"; render(); };
    const pieB = document.getElementById('subViewPie'), trendB = document.getElementById('subViewTrend');
    if(pieB) pieB.onclick = ()=>{ summarySubView="pie"; render(); };
    if(trendB) trendB.onclick = ()=>{ summarySubView="trend"; render(); };
    const greeting = document.getElementById('greetingText');
    if(greeting) greeting.onclick = async ()=>{
      const name = prompt("ชื่อผู้ใช้ (เก็บในเครื่องนี้เท่านั้น)", state.settings.userName||"");
      if(name!==null){ state.settings.userName = name.trim(); await saveState(); render(); }
    };
    document.querySelectorAll('[data-due-target]').forEach(c=>{
      c.onclick = ()=>{
        if(dueStackDragged){ dueStackDragged = false; return; }
        const target = c.dataset.dueTarget;
        if(target==="car"){ activeTab="car"; }
        else { activeTab="bills"; billSpace = c.dataset.dueSpace || "ratchaburi"; }
        render();
      };
    });
    attachDueStackSwipe();
  }

  if(activeTab==="car"){
    attachBillGroupHandlers();
  }

  if(activeTab==="bills"){
    const spaceR = document.getElementById('spaceRatchaburi'), spaceP = document.getElementById('spacePersonal');
    if(spaceR) spaceR.onclick = ()=>{ billSpace="ratchaburi"; render(); };
    if(spaceP) spaceP.onclick = ()=>{ billSpace="personal"; render(); };

    if(billSpace==="ratchaburi"){
      document.getElementById('prevMonth').onclick = ()=>{ state.currentBillMonth = shiftMonth(state.currentBillMonth,-1); render(); };
      document.getElementById('nextMonth').onclick = ()=>{ state.currentBillMonth = shiftMonth(state.currentBillMonth,1); render(); };
      const hYearPrev = document.getElementById('historyYearPrev'), hYearNext = document.getElementById('historyYearNext');
      if(hYearPrev) hYearPrev.onclick = ()=>{ ratchaburiHistoryYear--; render(); };
      if(hYearNext) hYearNext.onclick = ()=>{ ratchaburiHistoryYear++; render(); };

      document.querySelectorAll('[data-bill-field]').forEach(inp=>{
        inp.onchange = async ()=>{
          const bill = getOrCreateBill(state.currentBillMonth);
          bill[inp.dataset.billField] = parseFloat(inp.value)||0;
          await saveState(); render();
        };
      });
      document.querySelectorAll('[data-toggle-paid]').forEach(pill=>{
        pill.onclick = async ()=>{
          const bill = getOrCreateBill(state.currentBillMonth);
          if(bill.historical) return;
          const key = pill.dataset.togglePaid;
          bill.paid = bill.paid || {};
          bill.paid[key] = !bill.paid[key];
          await saveState(); render();
        };
      });
      const includesNes = document.getElementById('includesNes');
      if(includesNes) includesNes.onchange = async ()=>{
        const bill = getOrCreateBill(state.currentBillMonth);
        bill.includesNes = includesNes.checked;
        await saveState(); render();
      };
      const addPersonBtn = document.getElementById('addPersonBtn');
      if(addPersonBtn) addPersonBtn.onclick = async ()=>{
        const inp = document.getElementById('newPersonInput');
        const name = inp.value.trim();
        if(name){ state.settings.people.push(name); await saveState(); render(); }
      };
      document.querySelectorAll('[data-remove-person]').forEach(btn=>{
        btn.onclick = async ()=>{
          state.settings.people.splice(parseInt(btn.dataset.removePerson),1);
          await saveState(); render();
        };
      });
    } else {
      attachBillGroupHandlers();
    }
  }

  if(activeTab==="more"){
    document.querySelectorAll('[data-open]').forEach(item=>{
      item.onclick = ()=>{ moreView = item.dataset.open; render(); };
    });
    const back = document.getElementById('moreBack');
    if(back) back.onclick = ()=>{ moreView = "menu"; render(); };

    if(moreView==="recurring"){
      document.querySelectorAll('.cat-chip').forEach(chip=>{
        chip.onclick = ()=>{
          const grid = chip.parentElement;
          grid.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
          chip.classList.add('selected');
          document.getElementById(grid.dataset.hiddenId).value = chip.dataset.cat;
        };
      });
      const recSaveBtn = document.getElementById('recSaveBtn');
      if(recSaveBtn) recSaveBtn.onclick = async ()=>{
        const name = document.getElementById('recName').value.trim();
        if(!name){ showToast("ใส่ชื่อรายการก่อนนะคะ"); return; }
        const amtRaw = document.getElementById('recAmount').value;
        const day = parseInt(document.getElementById('recDay').value)||1;
        state.recurring.push({
          id: uid(), name,
          category: document.getElementById('recCategory').value,
          amount: amtRaw==="" ? null : parseFloat(amtRaw),
          day, enabled: true
        });
        await saveState();
        showToast("เพิ่มรายจ่ายประจำแล้ว");
        render();
      };
      document.querySelectorAll('[data-rec-toggle]').forEach(cb=>{
        cb.onchange = async ()=>{
          const r = state.recurring.find(x=>x.id===cb.dataset.recToggle);
          if(r){ r.enabled = cb.checked; await saveState(); }
        };
      });
      document.querySelectorAll('[data-rec-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          state.recurring = state.recurring.filter(x=>x.id!==btn.dataset.recDel);
          await saveState(); render();
        };
      });
    }

    if(moreView==="debts"){
      const oB=document.getElementById('debtTabOwe'), dB=document.getElementById('debtTabOwed');
      if(oB) oB.onclick = ()=>{ debtTab="owe"; render(); };
      if(dB) dB.onclick = ()=>{ debtTab="owed"; render(); };

      const debtSaveBtn = document.getElementById('debtSaveBtn');
      if(debtSaveBtn) debtSaveBtn.onclick = async ()=>{
        const person = document.getElementById('debtPerson').value.trim();
        const amount = parseFloat(document.getElementById('debtAmount').value);
        if(!person || !amount || amount<=0){ showToast("กรอกชื่อคนและจำนวนเงินให้ครบนะคะ"); return; }
        state.debts[debtTab].push({
          id: uid(), person, amount,
          lendDate: document.getElementById('debtLendDate').value || todayISO(),
          dueDate: document.getElementById('debtDueDate').value || null,
          settled: false
        });
        await saveState();
        showToast("เพิ่มรายการแล้ว");
        render();
      };
      document.querySelectorAll('[data-debt-settle]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = state.debts[debtTab].find(x=>x.id===btn.dataset.debtSettle);
          if(d){ d.settled = true; await saveState(); render(); }
        };
      });
      document.querySelectorAll('[data-debt-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          state.debts[debtTab] = state.debts[debtTab].filter(x=>x.id!==btn.dataset.debtDel);
          await saveState(); render();
        };
      });
    }

    if(moreView==="sync"){
      const saveBtn = document.getElementById('syncSaveBtn');
      if(saveBtn) saveBtn.onclick = async ()=>{
        const sheetUrl = document.getElementById('syncSheetUrl').value.trim();
        const userIdVal = document.getElementById('syncUserId').value.trim();
        if(!sheetUrl || !userIdVal){ showToast("กรอกให้ครบทั้ง 2 ช่องนะคะ"); return; }
        syncStatus = "กำลังทดสอบการเชื่อมต่อ...";
        render();
        try{
          state.sync.sheetUrl = sheetUrl;
          state.sync.userId = userIdVal;
          const remote = await fetchRemoteTransactions();
          state.transactions = remote.map(r => ({
            id: "sheet-" + (r.timestamp || uid()),
            date: r.date, type: r.type, category: r.category,
            merchant: r.merchant, amount: r.amount,
            isCard: false, source: "sync"
          }));
          await saveState();
          syncStatus = "เชื่อมต่อสำเร็จ พบ " + remote.length + " รายการใน Sheet";
          showToast("เชื่อมต่อสำเร็จ");
        }catch(e){
          syncStatus = "เชื่อมต่อไม่สำเร็จ เช็ค URL อีกครั้งนะคะ";
        }
        render();
      };
      const disconnectBtn = document.getElementById('syncDisconnectBtn');
      if(disconnectBtn) disconnectBtn.onclick = async ()=>{
        state.sync.sheetUrl = null;
        state.sync.userId = null;
        syncStatus = "ยกเลิกการเชื่อมต่อแล้ว ข้อมูลที่เคยดึงมายังอยู่ในเครื่อง";
        await saveState();
        render();
      };
      const migrateBtn = document.getElementById('syncMigrateBtn');
      if(migrateBtn) migrateBtn.onclick = async ()=>{
        const localOnly = state.transactions.filter(function(t){ return t.source !== "sync" && String(t.id).indexOf("sheet-") !== 0; });
        if(!localOnly.length){ showToast("ไม่มีข้อมูลเดิมในเครื่องที่ต้องย้าย"); return; }
        migrateBtn.disabled = true;
        syncStatus = "กำลังส่ง " + localOnly.length + " รายการขึ้น Sheet...";
        render();
        let sent = 0;
        for(const tx of localOnly){
          try{ await pushTransactionToSheet(tx); sent++; }catch(e){ /* skip failed row, continue */ }
        }
        const remote = await fetchRemoteTransactions();
        state.transactions = remote.map(r => ({
          id: "sheet-" + (r.timestamp || uid()),
          date: r.date, type: r.type, category: r.category,
          merchant: r.merchant, amount: r.amount,
          isCard: false, source: "sync"
        }));
        await saveState();
        syncStatus = "ส่งขึ้นสำเร็จ " + sent + "/" + localOnly.length + " รายการ";
        render();
      };
    }

    if(moreView==="demo"){
      const loadBtn = document.getElementById('loadDemoBtn');
      if(loadBtn) loadBtn.onclick = async ()=>{
        await loadDemoData();
        showToast("โหลดข้อมูลตัวอย่างแล้ว ลองดูทุกหน้าได้เลยค่ะ");
        render();
      };
      const clearBtn = document.getElementById('clearDemoBtn');
      if(clearBtn) clearBtn.onclick = async ()=>{
        await clearDemoData();
        showToast("ล้างข้อมูลตัวอย่างแล้ว คืนข้อมูลจริงเรียบร้อย");
        render();
      };
    }
  }
}

function shiftMonth(mk, delta){
  const [y,m] = mk.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return monthKey(d);
}

async function saveTransaction(tx){
  tx.id = uid();
  state.transactions.unshift(tx);
  await saveState();
  if(state.sync.sheetUrl && state.sync.userId){
    try{ await pushTransactionToSheet(tx); }
    catch(e){ showToast("บันทึกในเครื่องแล้ว แต่ส่งขึ้น Google Sheet ไม่สำเร็จ"); }
  }
  showToast("บันทึกรายการแล้ว");
  activeTab = "dashboard";
  render();
}

/* ============ INIT ============ */
(async function init(){
  document.getElementById('view').innerHTML = `<div class="empty">กำลังโหลด...</div>`;
  await loadState();
  render();
})();
</script>
